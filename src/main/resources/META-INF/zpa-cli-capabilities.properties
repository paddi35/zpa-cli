# Fork features of this zpa-cli build (paddi35/zpa-cli), for clients that inspect the installation offline
# (e.g. zpa-for-vscode reads this file from the zpa-cli jar in lib/).
# Stable contract: one key per feature present in this build; the value is the feature's revision (an integer,
# currently 1, raised only for incompatible changes). Keys are never renamed or removed while the feature exists;
# a missing key or a missing file means the feature is absent (the official upstream releases have no such file).
#
# daemon:           --daemon, line-based JSON protocol on stdin/stdout (see README, "Daemon mode")
# stdin-project:    --files - --stdin-filename <path> without --syntax-only analyzes stdin as an overlay of a project file
# quick-fixes:      optional "quickFixes" per issue in the json and sq-generic-issue-import formats
# context-overlays: --context-overlay <path> <file> (repeatable) uses the content of <file> for the project file <path>
#                   as project context only (e.g. other unsaved editor buffers)
# fix:              --fix / --fix-dry-run / --fix-max-rounds apply the quick fixes to the analyzed files on disk
# sarif:            --output-format sarif produces a SARIF 2.1.0 log
daemon=1
stdin-project=1
quick-fixes=1
context-overlays=1
fix=1
sarif=1
